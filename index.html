<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H xin lỗi </title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
        }

        /* Khung chứa cả vương miện và ảnh */
        .page-container {
            display: flex;
            flex-direction: column; /* Xếp vương miện nằm trên ảnh */
            align-items: center;    /* Căn giữa cả hai thành phần */
            position: relative;
        }

        /* Định dạng cho biểu tượng vương miện hoa hậu */
        .crown-icon {
            font-size: 60px;       /* Kích thước vương miện */
            margin-bottom: -15px;  /* Đẩy vương miện hơi chạm nhẹ vào mép ảnh cho tự nhiên */
            z-index: 2;            /* Đảm bảo vương miện nằm đè lên trên ảnh nếu chạm nhau */
            animation: float 3s ease-in-out infinite; /* Hiệu ứng nhấp nhô nhẹ cho sinh động */
        }

        /* Định dạng cho tấm ảnh */
        .image-container img {
            max-width: 90vw; 
            max-height: 70vh; 
            border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); 
            border: 4px solid #ffd700; /* Thêm viền màu vàng gold cho đúng chuẩn hoa hậu */
            z-index: 1;
        }

        /* Tạo hiệu ứng chuyển động bay nhẹ cho vương miện */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Biểu tượng vương miện hoa hậu -->
        <div class="crown-icon">👑</div>

        <!-- Khung chứa ảnh của bạn -->
        <div class="image-container">
            <!-- BẠN DÁN LINK ẢNH VÀO TRONG DẤU NGOẶC KÉP CỦA src KHÔNG ĐỔI -->
            <img src="ok.png" alt="Ảnh hoa hậu">
        </div>
    </div>

</body>
</html>
